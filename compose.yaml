name: tailplan

services:
  tailplan:
    build:
      context: .
    image: tailplan:0.6.0
    restart: unless-stopped
    init: true
    environment:
      TAILPLAN_HOST: 0.0.0.0
      TAILPLAN_PORT: 9127
      TAILPLAN_DATA_DIR: /var/lib/tailplan
      TAILPLAN_TOKEN_FILE: /run/secrets/tailplan_upload_token
      TAILPLAN_BASE_URL: ${TAILPLAN_BASE_URL:-http://127.0.0.1:9127}
      # Optional. The entrypoint drops empty values. See "Run behind Tailscale Serve".
      TAILPLAN_PROXY_HOST: ${TAILPLAN_PROXY_HOST:-}
      TAILPLAN_PROXY_PORT: ${TAILPLAN_PROXY_PORT:-}
      TAILPLAN_TRUST_TAILSCALE_IDENTITY: ${TAILPLAN_TRUST_TAILSCALE_IDENTITY:-}
      TAILPLAN_TAILSCALE_VIEWER: ${TAILPLAN_TAILSCALE_VIEWER:-}
      TAILPLAN_OWNER_LOGIN: ${TAILPLAN_OWNER_LOGIN:-}
      TAILPLAN_ALLOWED_LOGINS: ${TAILPLAN_ALLOWED_LOGINS:-}
      TAILPLAN_VIEWER_404_LIMIT: ${TAILPLAN_VIEWER_404_LIMIT:-}
      TAILPLAN_REDIRECT_VIEW_BASE_URL: ${TAILPLAN_REDIRECT_VIEW_BASE_URL:-}
      # Optional. Path inside the container to a cookie signing secret. See docs/security.md.
      TAILPLAN_SESSION_SECRET_FILE: ${TAILPLAN_SESSION_SECRET_FILE:-}
      # Optional. Key for the actor hashes in the audit log. See docs/security.md.
      TAILPLAN_AUDIT_HMAC_KEY: ${TAILPLAN_AUDIT_HMAC_KEY:-}
      # Optional. Single sign-on, roles, and sharing. See docs/security.md.
      TAILPLAN_AUTH_MODES: ${TAILPLAN_AUTH_MODES:-}
      TAILPLAN_OIDC_ISSUER: ${TAILPLAN_OIDC_ISSUER:-}
      TAILPLAN_OIDC_CLIENT_ID: ${TAILPLAN_OIDC_CLIENT_ID:-}
      TAILPLAN_OIDC_CLIENT_SECRET_FILE: ${TAILPLAN_OIDC_CLIENT_SECRET_FILE:-}
      TAILPLAN_OIDC_SCOPES: ${TAILPLAN_OIDC_SCOPES:-}
      TAILPLAN_OIDC_GROUPS_CLAIM: ${TAILPLAN_OIDC_GROUPS_CLAIM:-}
      TAILPLAN_OIDC_ALLOW_PRIVATE_ISSUER: ${TAILPLAN_OIDC_ALLOW_PRIVATE_ISSUER:-}
      TAILPLAN_OIDC_LINK_EMAILS: ${TAILPLAN_OIDC_LINK_EMAILS:-}
      TAILPLAN_SESSION_TTL_SECONDS: ${TAILPLAN_SESSION_TTL_SECONDS:-}
      TAILPLAN_RBAC_POLICY_FILE: ${TAILPLAN_RBAC_POLICY_FILE:-}
      TAILPLAN_VIEWER_AUTH_MODE: ${TAILPLAN_VIEWER_AUTH_MODE:-}
      TAILPLAN_MAX_VISIBILITY: ${TAILPLAN_MAX_VISIBILITY:-}
    ports:
      - "${TAILPLAN_BIND_ADDRESS:-127.0.0.1}:${TAILPLAN_PORT:-9127}:9127"
    volumes:
      - tailplan-data:/var/lib/tailplan
    secrets:
      - tailplan_upload_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/tailplan:size=1m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  tailplan-data:

secrets:
  tailplan_upload_token:
    file: ${HOME}/.tailplan/token
