name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.tag.outputs.commit-sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Require a verified annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          object_type="$(jq -r '.object.type // empty' <<<"$ref_json")"
          if [[ "$object_type" != "tag" ]]; then
            echo "GitHub must cryptographically verify an annotated release tag." >&2
            exit 1
          fi
          tag_sha="$(jq -r '.object.sha // empty' <<<"$ref_json")"
          tag_json="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          if ! jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag == $tag and .object.type == "commit" and .verification.verified == true' \
            <<<"$tag_json" >/dev/null; then
            echo "Release tag verification failed." >&2
            exit 1
          fi
          commit_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The verified tag does not identify a commit." >&2
            exit 1
          fi
          echo "commit-sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.commit-sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: bash tests/smoke.sh
      - run: python tests/check_ste100.py
      - run: docker build --tag tailplan:release .
      - name: Build release assets
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit-sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"
          python -c 'import os, pathlib, re; text=pathlib.Path("CHANGELOG.md").read_text(); version=os.environ["GITHUB_REF_NAME"][1:]; headings=[line[3:] for line in text.splitlines() if line.startswith("## ")]; empty=text.split("## Unreleased", 1)[1].split("## ", 1)[0].strip() == ""; valid=bool(headings and headings[0] == "Unreleased" and empty and any(re.fullmatch(re.escape(version) + r" - \d{4}-\d{2}-\d{2}", heading) for heading in headings)); raise SystemExit(0 if valid else 1)'
          git archive --format=tar.gz --prefix="tailplan-${version}/" --output="tailplan-${version}.tar.gz" "$RELEASE_COMMIT"
          sha256sum "tailplan-${version}.tar.gz" > "tailplan-${version}.tar.gz.sha256"
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            tailplan-${{ needs.verify-tag.outputs.version }}.tar.gz
            tailplan-${{ needs.verify-tag.outputs.version }}.tar.gz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "tailplan-${version}.tar.gz" \
            "tailplan-${version}.tar.gz.sha256" \
            --generate-notes \
            --title "Tailplan $GITHUB_REF_NAME" \
            --draft \
            --verify-tag
