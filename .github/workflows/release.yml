name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.tag.outputs.commit-sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify the release tag
        id: tag
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          main_ref="refs/remotes/origin/main"
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"

          git fetch --force --no-tags origin \
            "refs/heads/main:${main_ref}"
          git show "${main_ref}:.github/release-allowed-signers" > "$allowed_signers"
          git fetch --force --no-tags origin \
            "${tag_ref}:${tag_ref}"

          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "The release tag must be an annotated tag." >&2
            exit 1
          fi
          if [[ "$(git for-each-ref --format='%(tag)' "$tag_ref")" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag object name must match the release tag reference." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          main_commit="$(git rev-parse "${main_ref}^{commit}")"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "The signed release tag must identify the protected main commit." >&2
            exit 1
          fi

          git \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$tag_ref"

          echo "commit-sha=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.commit-sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: bash tests/smoke.sh
      - run: python tests/check_ste100.py
      - run: docker build --tag tailplan:release .
      - name: Build release assets
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit-sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"
          python -c 'import os, pathlib, re; text=pathlib.Path("CHANGELOG.md").read_text(); version=os.environ["GITHUB_REF_NAME"][1:]; headings=[line[3:] for line in text.splitlines() if line.startswith("## ")]; empty=text.split("## Unreleased", 1)[1].split("## ", 1)[0].strip() == ""; valid=bool(headings and headings[0] == "Unreleased" and empty and any(re.fullmatch(re.escape(version) + r" - \d{4}-\d{2}-\d{2}", heading) for heading in headings)); raise SystemExit(0 if valid else 1)'
          git archive --format=tar.gz --prefix="tailplan-${version}/" --output="tailplan-${version}.tar.gz" "$RELEASE_COMMIT"
          sha256sum "tailplan-${version}.tar.gz" > "tailplan-${version}.tar.gz.sha256"
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            tailplan-${{ needs.verify-tag.outputs.version }}.tar.gz
            tailplan-${{ needs.verify-tag.outputs.version }}.tar.gz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "tailplan-${version}.tar.gz" \
            "tailplan-${version}.tar.gz.sha256" \
            --generate-notes \
            --title "Tailplan $GITHUB_REF_NAME" \
            --draft \
            --verify-tag
