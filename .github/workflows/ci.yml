name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked --python "$pythonLocation/bin/python"
      - run: uv run --no-sync tailplan-server --help
      - run: uv run --no-sync python -m pytest -q -rs --strict-config --strict-markers --ignore=tests/test_theme_browser.py -k "not (system or failed_rotation_restores_both_private_token_copies) or system_install_requires_root" --junitxml=test-results/unit.xml
      - run: uv run --no-sync python tests/check_junit.py test-results/unit.xml --minimum 362
      - run: uv run --no-sync bash tests/smoke.sh
      - run: uv run --no-sync python tests/check_ste100.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  system-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --python "$pythonLocation/bin/python"
      - name: Test the system installer as root
        run: >-
          sudo -- "$PWD/.venv/bin/python" -m pytest -q
          tests/test_install.py tests/test_ssh_publisher.py
          -k "(system or failed_rotation_restores_both_private_token_copies) and not system_install_requires_root"
          --junitxml=test-results/system.xml
      - run: uv run --no-sync python tests/check_junit.py test-results/system.xml --minimum 18
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: system-installer
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --python "$pythonLocation/bin/python"
      - run: uv run --no-sync python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify mobile, desktop, accessibility, and print layout
        env:
          TAILPLAN_BROWSER_TESTS: "1"
        run: >-
          uv run --no-sync python -m pytest -q tests/test_theme_browser.py
          --browser "${{ matrix.browser }}" --tracing retain-on-failure
          --screenshot only-on-failure --output test-results/browser
          --junitxml=test-results/browser.xml
      - name: Reject skipped or incomplete browser coverage
        run: uv run --no-sync python tests/check_junit.py test-results/browser.xml --minimum 42
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv build
      - name: Verify wheel and source distribution in clean environments
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            environment="$RUNNER_TEMP/$(basename "$artifact").venv"
            uv venv --python "$pythonLocation/bin/python" "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            (
              cd "$RUNNER_TEMP"
              "$environment/bin/tailplan-server" --help
              "$environment/bin/python" -I "$GITHUB_WORKSPACE/tests/check_distribution.py" "$GITHUB_WORKSPACE"
            )
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag tailplan:ci .

  quality-gate:
    if: always()
    needs: [tests, system-installer, browser, distributions, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          assert len(results) == 5 and not failed, failed
          print('All required CI jobs passed')
          PY
