name: Feature request
description: Propose one user-visible Tailplan change.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem and the affected deployment type.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Describe the observable result that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: Describe a workaround that does not disable authentication or network access controls.
