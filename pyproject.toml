[project]
name = "tailplan"
version = "0.6.0"
description = "Tailnet-only static HTML draft publishing for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["agents", "static-html", "tailscale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
oidc = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
tailplan-server = "tailplan_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tailplan_server"]
packages = ["tailplan_themes", "tailplan_web", "tailplan_ui", "tailplan_ui.color"]

[tool.setuptools.package-data]
tailplan_themes = ["*.json", "*.css", "palettes/*.json", "typography/*.json", "licenses/*.txt"]
tailplan_web = ["static/*", "static/fonts/*"]
tailplan_ui = ["css/*.css", "primitives/*.css", "blocks/*.css", "wireframes/*.css", "wireframes/*.json", "palettes/*.json", "licenses/*.txt", "registry.json"]
"tailplan_ui.color" = ["*.json"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "PyJWT[crypto]>=2.10,<3",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pyyaml>=6.0.3",
]
