[project]
name = "tailplan"
version = "0.3.0"
description = "Tailnet-only static HTML draft publishing for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["agents", "static-html", "tailscale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
tailplan-server = "tailplan_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tailplan_server"]
packages = ["tailplan_themes"]

[tool.setuptools.package-data]
tailplan_themes = ["*.json", "*.css", "palettes/*.json", "typography/*.json", "licenses/*.txt"]

[tool.ruff]
line-length = 100
